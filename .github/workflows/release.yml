name: Release

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed remote D1 before deploy'
        required: true
        type: boolean
        default: false
      deploy:
        description: 'Deploy Worker'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/**'
      - 'apps/site/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'apps/api/wrangler.jsonc'
      - 'apps/api/scripts/seed.ts'
      - 'data/*.json'
      - 'migrations/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect release work
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seed=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "deploy=${{ inputs.deploy }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)"
          seed=false
          deploy=false

          if printf '%s\n' "$changed" | grep -Eq '^(data/.*\.json|apps/api/scripts/seed\.ts|migrations/)'; then
            seed=true
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(apps/api/src/|apps/site/|packages/|package\.json|bun\.lock|apps/api/wrangler\.jsonc|migrations/)'; then
            deploy=true
          fi

          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Check Worker
        run: bun check

      - name: Test Worker
        run: bun test

      - name: Check seed safety
        if: steps.changes.outputs.seed == 'true'
        run: bun test tests/seed.test.ts

      - name: Seed D1 database
        if: steps.changes.outputs.seed == 'true'
        run: bun seed:upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CACHE_ZONE: ${{ secrets.CACHE_ZONE }}

      - name: Build Astro site
        if: steps.changes.outputs.deploy == 'true'
        run: bun run --filter @geocoded/site build

      - name: Deploy Worker
        if: steps.changes.outputs.deploy == 'true'
        run: bun --bun wrangler deploy --config apps/api/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployed timezone schema
        if: steps.changes.outputs.deploy == 'true'
        run: |
          bun -e '
            const cacheBust = encodeURIComponent(process.env.GITHUB_SHA ?? String(Date.now()))
            let lastError

            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                const specResponse = await fetch(`https://api.geocoded.me/openapi.json?deploy_check=${cacheBust}-${attempt}`, {
                  headers: { "Cache-Control": "no-cache" },
                })
                if (!specResponse.ok) {
                  throw new Error(`OpenAPI check failed: ${specResponse.status}`)
                }
                const spec = await specResponse.json()
                const props = spec.paths?.["/timezones"]?.get?.responses?.["200"]?.content?.["application/json"]?.schema?.properties?.data?.items?.properties
                if (!props?.standardOffsetName || props?.comments) {
                  throw new Error("Live timezone schema is stale")
                }

                const dataResponse = await fetch(`https://api.geocoded.me/timezones?limit=1&fields=timezone,standardOffsetName,observesDst&deploy_check=${cacheBust}-${attempt}`, {
                  headers: { "Cache-Control": "no-cache" },
                })
                if (!dataResponse.ok) {
                  throw new Error(`Timezone API check failed: ${dataResponse.status}`)
                }
                const body = await dataResponse.json()
                const row = body.data?.[0]
                if (!row || !("standardOffsetName" in row) || !("observesDst" in row) || "comments" in row) {
                  throw new Error("Live timezone response is stale")
                }
                process.exit(0)
              } catch (error) {
                lastError = error
                await new Promise((resolve) => setTimeout(resolve, 5000))
              }
            }
            throw lastError
          '
