name: Publish packages

run-name: Publish npm packages from ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'lerna.json'
      - 'tsdown.config.mts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: Utilities-Studio/infra/.github/workflows/npm-publish.yml@main
    with:
      release_app_id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
